services:
  postgres:
    image: postgres:18
    container_name: wolf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wolf
      POSTGRES_PASSWORD: wolf-dev-password
      POSTGRES_DB: wolfdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolf -d wolfdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
