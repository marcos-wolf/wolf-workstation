[project]
name = "wolf-python-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
{ name = "Marcos Wolf", email = "[MGWOLF2002@GMAIL.COM](mailto:MGWOLF2002@GMAIL.COM)" }
]
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
wolf-python-test = "wolf_python_test:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
"pytest>=9.1.1",
"ruff>=0.16.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
"E",
"F",
"I",
"UP",
"B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
