name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  workstation-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f docs/software.md
          test -f docs/infrastructure/docker.md
          test -f docs/infrastructure/aws-cli.md

      - name: Verify Docker documentation
        run: |
          grep -q "Docker" docs/infrastructure/docker.md

      - name: Verify AWS CLI documentation
        run: |
          grep -q "AWS CLI" docs/infrastructure/aws-cli.md

  python:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/python/wolf-python-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest
