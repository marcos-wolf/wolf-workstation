name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  workstation-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Validate dotfiles installer
        run: |
          ./scripts/install-dotfiles.sh
          cp "$HOME/.bashrc" /tmp/bashrc.after-first-install

          ./scripts/install-dotfiles.sh
          cmp -s "$HOME/.bashrc" /tmp/bashrc.after-first-install

          test -f "$HOME/.config/wolf-workstation/bashrc"
          grep -Fqx "# Wolf Workstation" "$HOME/.bashrc"

      - name: Validate user data backup script
        run: |
          bash -n scripts/backup-user-data.sh

          ./scripts/backup-user-data.sh --help

          mkdir -p \
            "$HOME/Documents" \
            "$HOME/Pictures" \
            "$HOME/Music" \
            "$HOME/Videos"

          echo "backup test" > "$HOME/Documents/test.txt"
          echo "picture test" > "$HOME/Pictures/test.txt"

          mkdir -p /tmp/wolf-backup-test

          ./scripts/backup-user-data.sh --dry-run /tmp/wolf-backup-test

          test -z "$(find /tmp/wolf-backup-test -mindepth 1 -print -quit)"

          ./scripts/backup-user-data.sh /tmp/wolf-backup-test

          test -d /tmp/wolf-backup-test/Documents
          test -d /tmp/wolf-backup-test/Pictures
          test -d /tmp/wolf-backup-test/Music
          test -d /tmp/wolf-backup-test/Videos

          test -f /tmp/wolf-backup-test/Documents/test.txt
          test -f /tmp/wolf-backup-test/Pictures/test.txt

          ./scripts/backup-user-data.sh /tmp/wolf-backup-test

          test -f /tmp/wolf-backup-test/Documents/test.txt
          test -f /tmp/wolf-backup-test/Pictures/test.txt

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f docs/software.md
          test -f docs/infrastructure/docker.md
          test -f docs/infrastructure/aws-cli.md
          test -f docs/provisioning.md
          test -f docs/external-tools.md
          test -f config/apt-packages.txt
          test -f config/user-tools.env
          test -x scripts/bootstrap-core.sh
          test -x scripts/bootstrap-github-cli.sh
          test -x scripts/bootstrap-user-tools.sh
          test -x scripts/bootstrap-docker.sh
          test -x scripts/bootstrap-vscode.sh

      - name: Validate provisioning script
        run: |
          bash -n scripts/bootstrap-core.sh
          ./scripts/bootstrap-core.sh
          bash -n scripts/bootstrap-github-cli.sh
          ./scripts/bootstrap-github-cli.sh
          bash -n scripts/bootstrap-user-tools.sh
          ./scripts/bootstrap-user-tools.sh
          bash -n scripts/bootstrap-docker.sh
          ./scripts/bootstrap-docker.sh
          bash -n scripts/bootstrap-vscode.sh
          ./scripts/bootstrap-vscode.sh

      - name: Verify Docker documentation
        run: |
          grep -q "Docker" docs/infrastructure/docker.md

      - name: Verify AWS CLI documentation
        run: |
          grep -q "AWS CLI" docs/infrastructure/aws-cli.md

  python:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/python/wolf-python-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

  node:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/node/wolf-node-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: projects/node/wolf-node-test/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

  c:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/c/wolf-c-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Run
        run: ./build/wolf-c-test

  docker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/docker/wolf-infra-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose config

      - name: Start services
        run: docker compose up -d

      - name: Check service health
        run: |
          for i in {1..12}; do
            status="$(docker compose ps --format '{{.Status}}')"
            echo "$status"

            if echo "$status" | grep -q "healthy"; then
              exit 0
            fi

            sleep 5
          done

          docker compose ps
          exit 1

      - name: Stop services
        if: always()
        run: docker compose down
