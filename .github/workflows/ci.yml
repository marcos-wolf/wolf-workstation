name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  workstation-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f docs/software.md
          test -f docs/infrastructure/docker.md
          test -f docs/infrastructure/aws-cli.md
          test -f docs/provisioning.md
          test -f docs/external-tools.md
          test -f config/apt-packages.txt
          test -x scripts/bootstrap-core.sh

      - name: Validate provisioning script
        run: |
          bash -n scripts/bootstrap-core.sh
          ./scripts/bootstrap-core.sh

      - name: Verify Docker documentation
        run: |
          grep -q "Docker" docs/infrastructure/docker.md

      - name: Verify AWS CLI documentation
        run: |
          grep -q "AWS CLI" docs/infrastructure/aws-cli.md

  python:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/python/wolf-python-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  node:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/node/wolf-node-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: projects/node/wolf-node-test/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm run check

      - name: Build TypeScript
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

  c:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/c/wolf-c-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build project
        run: cmake --build build --parallel

      - name: Run executable
        run: ./build/wolf-c-test

  docker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/docker/wolf-infra-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config
